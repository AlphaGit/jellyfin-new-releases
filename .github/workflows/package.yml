name: package

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# The published repository lives in the committed repo/ directory and is served by Pages, so a
# release both writes back to the branch and deploys the site.
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: package
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install JPRM
        run: pip install jprm==1.1.0

      # JPRM normalises a version to four parts and names the package for the normalised one,
      # so tag v1.0.0 yields jellyfin-new-releases_1.0.0.0.zip. Both forms are needed: the three
      # part one to pass to JPRM, the four part one to find what it wrote.
      - name: Derive version from tag
        id: ver
        run: |
          version="${GITHUB_REF_NAME#v}"
          version4="$version"
          while [ "$(printf '%s' "$version4" | tr -cd . | wc -c)" -lt 3 ]; do version4="$version4.0"; done
          echo "version=$version"   >> "$GITHUB_OUTPUT"
          echo "version4=$version4" >> "$GITHUB_OUTPUT"

      - name: Configure Pages
        uses: actions/configure-pages@v6

      # Build to a staging directory: `jprm repo add` copies the package into repo/ itself, and
      # would otherwise be copying a file onto itself.
      - name: Package with JPRM
        run: |
          mkdir -p ./artifacts
          jprm plugin build . --version "${{ steps.ver.outputs.version }}" --output ./artifacts

      # JPRM rewrites <TargetFramework> from build.yaml while packaging and restores it; it also
      # rewrites <Version> and does NOT restore that. Contract statement 6 is about the framework,
      # so that is what is checked, and the project file is put back before anything is committed.
      - name: Verify packaging restored the target framework
        run: |
          grep -q '<TargetFramework>net10.0</TargetFramework>' \
            src/Jellyfin.Plugin.NewReleases/Jellyfin.Plugin.NewReleases.csproj
          git checkout -- src/Jellyfin.Plugin.NewReleases/Jellyfin.Plugin.NewReleases.csproj

      - name: Add the version to the published repository
        run: |
          jprm repo add \
            --url "${{ steps.pages.outputs.base_url || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}" \
            ./repo/manifest.json \
            "./artifacts/jellyfin-new-releases_${{ steps.ver.outputs.version4 }}.zip"

      - name: Commit the published repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add repo
          git commit -m "release: publish ${{ steps.ver.outputs.version }} to the plugin repository"
          git push origin HEAD:main

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./repo

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v5
