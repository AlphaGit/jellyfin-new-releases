name: package

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# The published repository lives in the committed repo/ directory and is served by Pages, so a
# release both writes back to the branch and deploys the site.
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: package
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install JPRM
        run: pip install jprm==1.1.0

      - name: Derive version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Package with JPRM
        run: |
          mkdir -p ./repo/jellyfin-new-releases
          jprm plugin build . --version "${{ steps.ver.outputs.version }}" --output ./repo/jellyfin-new-releases

      # JPRM rewrites <TargetFramework> from build.yaml while packaging and is expected to restore
      # it. If it did not, the commit below would carry that edit onto main.
      - name: Verify packaging left the project file unchanged
        run: git diff --quiet -- src/Jellyfin.Plugin.NewReleases/Jellyfin.Plugin.NewReleases.csproj

      - name: Add the version to the published repository
        run: |
          jprm repo add \
            --url "${{ steps.pages.outputs.base_url || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}" \
            ./repo/manifest.json \
            "./repo/jellyfin-new-releases/jellyfin-new-releases_${{ steps.ver.outputs.version }}.zip"

      - name: Commit the published repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add repo
          git commit -m "release: publish ${{ steps.ver.outputs.version }} to the plugin repository"
          git push origin HEAD:main

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./repo

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v5
