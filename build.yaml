# JPRM (Jellyfin Plugin Repository Manager) build manifest.
# https://github.com/oddstr13/jellyfin-plugin-repository-manager
name: "Jellyfin New Releases"
guid: "b8a15db8-e368-42c4-9048-390faf0094db"
version: "0.1.0"
targetAbi: "12.0.0.0"
framework: "net10.0"
owner: "Alpha"
overview: "Releases by your library artists that your library does not have yet."
description: "Tracks releases by the library artists in your Jellyfin music library that the library does not yet contain. A daily Refresh reads MusicBrainz and Deezer, decides ownership by track list, and lists Missing, Incomplete and Upcoming releases in a New Releases view; users can Ignore a release or mark it Have it. Requires Jellyfin 12. The configuration page, the API and the daily refresh need nothing else installed. The New Releases entry in the side menu additionally needs the Plugin Pages plugin (3.0.0.0 or later) and File Transformation, and on Jellyfin 12 that entry does not currently render at all because Plugin Pages has not been updated for the rewritten web client; see the project README."
category: "General"
changelog: "Initial scaffold."
artifacts:
  - "Jellyfin.Plugin.NewReleases.dll"
  - "Microsoft.Data.Sqlite.dll"
  - "SQLitePCLRaw.batteries_v2.dll"
  - "SQLitePCLRaw.core.dll"
  - "SQLitePCLRaw.provider.e_sqlite3.dll"
  - "runtimes/linux-x64/native/libe_sqlite3.so"
